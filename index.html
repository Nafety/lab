<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Labo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Caveat:wght@500;700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="crosshair"></div>
    <div id="prompt" class="hidden"></div>
    <div id="start" class="overlay">
      <div class="card">
        <h1>Le Labo</h1>
        <p class="subtitle">Cabinet des curiosités</p>
        <p>Promène-toi dans le laboratoire et cultive toi.</p>
        <div id="loading">
          <div class="load-track"><div id="load-bar"></div></div>
          <p class="small" id="load-text">Préparation du laboratoire…</p>
        </div>
        <button id="play" class="hidden">Entrer dans le labo</button>
        <p class="credits">Modèles et textures : Poly Haven (CC0) · Planètes : Solar System Scope (CC BY 4.0) · Questions en direct : Wikipédia (CC BY-SA)</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
